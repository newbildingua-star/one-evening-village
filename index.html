<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#222C3A">
<title>Один вечір у селі</title>
<style>
:root{--night:#222C3A;--cream:#FFF1D9;--amber:#E8AD67;--rose:#C98F88;--olive:#72785B;--linen:#F4E3C5}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--night);color:var(--cream);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid var(--rose);outline-offset:3px}
.app{max-width:540px;min-height:100dvh;margin:auto;display:flex;flex-direction:column;position:relative;background:var(--night)}.hidden{display:none!important}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;min-height:50px}header strong{font-size:15px}header button,.ghost{background:transparent;color:var(--cream);border:1px solid #ffffff55;border-radius:10px;padding:8px 12px}
.photo{position:relative;width:100%;aspect-ratio:4/5;max-height:60dvh;overflow:hidden;background:#666;flex-shrink:0}.photo img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;transition:opacity .4s ease}.photo img.fade{opacity:0}.missing{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:#777;color:white;overflow-wrap:anywhere}.date{position:absolute;bottom:12px;right:15px;color:#ff9b45;text-shadow:1px 1px 1px #38200c;font:700 20px/1 monospace;letter-spacing:1px;pointer-events:none}
.storyPanel{padding:15px 18px 90px;flex:1;display:flex;flex-direction:column;gap:12px}.storyText{font-size:17px;line-height:1.55;min-height:3.1em;white-space:pre-wrap;cursor:pointer}.hint{font-size:12px;color:#c8c6c2}.choices{display:grid;gap:9px}.choice,.primary{border:0;border-radius:13px;background:var(--amber);color:var(--night);font-weight:750;min-height:50px;padding:12px 16px;text-align:center}.choice:disabled{opacity:.5}.small{font-size:12px;color:#c8c6c2}
.phoneFab{position:fixed;bottom:max(18px,env(safe-area-inset-bottom));right:max(18px,calc((100vw - 540px)/2 + 18px));width:60px;height:60px;border-radius:18px;border:2px solid var(--amber);background:#344456;color:var(--cream);font-size:30px;z-index:15;box-shadow:0 6px 18px #0006}.badge{position:absolute;right:-5px;top:-6px;background:#db4444;color:#fff;border-radius:50%;min-width:23px;height:23px;font:700 13px/23px sans-serif}.shake{animation:shake .6s ease-in-out 2}@keyframes shake{0%,100%{transform:rotate(0)}20%,60%{transform:rotate(-13deg)}40%,80%{transform:rotate(13deg)}}
.overlay{position:fixed;inset:0;z-index:30;background:#121a26ee;display:flex;align-items:center;justify-content:center;padding:18px}.menuCard{width:min(100%,430px);background:var(--night);border:1px solid #ffffff22;border-radius:20px;padding:24px;display:grid;gap:12px;text-align:center}.menuCard h1{margin:0;font-size:27px}.menuCard p{color:#ddd;font-size:14px;margin:0 0 8px}.menuCard .primary{width:100%}.menuCard .ghost{min-height:46px}.endingRow{padding:12px;border:1px solid #ffffff33;border-radius:10px;text-align:left}
.phoneOverlay{position:fixed;inset:0;z-index:25;background:#17202b;display:flex;align-items:center;justify-content:center;padding:12px}.handset{height:min(95dvh,850px);width:min(100%,390px);background:linear-gradient(145deg,#3e5265,#1a2737);border:5px solid #526579;border-radius:38px;padding:14px;box-shadow:inset 0 2px 5px #ffffff35,0 14px 35px #0008;display:flex;flex-direction:column;gap:12px}.phoneTop{display:flex;align-items:center;justify-content:space-between;color:#e5e5e5;font-size:13px}.phoneTop button{border:1px solid #ffffff77;border-radius:8px;background:#2b3745;color:white;padding:8px}.lcd{background:#a7bc8b;color:#233c29;border:7px solid #273c40;border-radius:12px;min-height:0;flex:1;display:flex;flex-direction:column;padding:10px;font-family:"Courier New",monospace;letter-spacing:-.4px;box-shadow:inset 0 0 16px #6b8657;overflow:hidden}.lcdBar{font-size:12px;display:flex;justify-content:space-between;gap:4px;border-bottom:1px solid #526d50;padding-bottom:7px}.lcdTitle{font-weight:bold;margin:10px 0 8px}.lcdList{overflow:auto;flex:1;display:flex;flex-direction:column;gap:8px}.smsItem,.reply{background:#b9cba2;border:1px solid #6b825f;border-radius:6px;color:#233c29;padding:9px;text-align:left;font-family:inherit;font-size:13px}.smsItem.unread{font-weight:bold}.smsItem small{display:block;font-weight:normal;opacity:.8}.smsBody{font-size:15px;line-height:1.4;white-space:pre-wrap}.lcdStatus{font-size:13px;min-height:20px;font-weight:bold}.phoneBack{margin-top:8px;align-self:start;border:1px solid #6b825f;background:transparent;color:#233c29;border-radius:5px;padding:7px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;height:130px}.key{border-radius:12px;background:#263646;color:#dce3e6;border:1px solid #6b7b87;display:grid;place-items:center;font-size:17px;font-weight:bold;box-shadow:0 3px 1px #121d27}.key:nth-child(10),.key:nth-child(12){color:var(--amber)}
@media(max-height:740px){.photo{max-height:52dvh}.storyPanel{padding-top:10px}.storyText{font-size:15px}.handset{height:98dvh}.keypad{height:95px}.key{font-size:14px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="story.js" defer></script>
</head>
<body>
<div class="app">
<header><strong>Один вечір у селі</strong><button id="menuBtn" aria-label="Відкрити меню">☰ Меню</button></header>
<main id="game" class="hidden">
 <div class="photo" id="photo" aria-label="Ілюстрація сцени"><div class="missing" id="missing">street.jpg</div><img id="sceneImage" alt="" class="hidden"><span class="date" id="sceneDate"></span></div>
 <section class="storyPanel"><div id="storyText" class="storyText" role="button" tabindex="0" aria-label="Торкніться для продовження"></div><div class="hint" id="hint">Торкніться тексту, щоб продовжити</div><div id="choices" class="choices"></div></section>
</main>
<button id="phoneFab" class="phoneFab hidden" aria-label="Відкрити телефон">▣<span id="unreadBadge" class="badge hidden">0</span></button>
</div>
<div id="menuOverlay" class="overlay"><div class="menuCard"><h1>Один вечір у селі</h1><p>Україна, літо 2005 · тестовий прототип</p><button id="continueBtn" class="primary">Продовжити</button><button id="newBtn" class="primary">Нова гра</button><button id="endingsBtn" class="ghost">Фінали</button><div id="endingsList" class="hidden"></div><button id="closeMenuBtn" class="ghost hidden">Повернутися до гри</button></div></div>
<div id="phoneOverlay" class="phoneOverlay hidden" role="dialog" aria-modal="true" aria-label="Кнопковий телефон"><div class="handset"><div class="phoneTop"><span>МІЙ ТЕЛЕФОН · 2005</span><button id="closePhoneBtn">✕ Закрити</button></div><div class="lcd"><div class="lcdBar"><span id="signalDisplay">▁▂▃▄  Мережа</span><span id="balanceDisplay">Баланс: 3 SMS</span></div><div class="lcdTitle" id="lcdTitle">Вхідні</div><div id="lcdList" class="lcdList"></div><div id="lcdStatus" class="lcdStatus" aria-live="polite"></div><button id="phoneBack" class="phoneBack hidden">← Вхідні</button></div><div class="keypad" aria-hidden="true"><div class="key">1</div><div class="key">2 ABC</div><div class="key">3 DEF</div><div class="key">4 GHI</div><div class="key">5 JKL</div><div class="key">6 MNO</div><div class="key">7 PQRS</div><div class="key">8 TUV</div><div class="key">9 WXYZ</div><div class="key">*</div><div class="key">0</div><div class="key">#</div></div></div></div>
<script>
(()=>{
'use strict';
const tg=window.Telegram&&window.Telegram.WebApp;
try{if(tg){tg.ready();tg.expand()}}catch(e){console.warn('Telegram unavailable',e)}
const $=id=>document.getElementById(id);
const scenes=new Map(STORY.map(s=>[s.id,s]));
const SAVE_KEY='village2005_save_v1',CLOUD_KEY='village2005_save_v1';
const defaults=()=>({scene:'start',flags:[],balance:3,messages:[],delivered:[],unlocked:[],revision:0});
let state=defaults(),current=null,typingTimer=null,typing=false,fullText='',charIndex=0,sceneToken=0,pendingSMS=[],phoneMessage=null,phoneOpen=false,saveQueue=Promise.resolve(),cloudLoaded=false;
const safeParse=s=>{try{const v=JSON.parse(s);return v&&typeof v==='object'&&typeof v.scene==='string'&&Array.isArray(v.flags)&&Array.isArray(v.messages)&&Array.isArray(v.delivered)&&Array.isArray(v.unlocked)?v:null}catch{return null}};
function save(){state.revision=Date.now();const payload=JSON.stringify(state);try{localStorage.setItem(SAVE_KEY,payload)}catch(e){console.warn(e)}if(tg?.CloudStorage?.setItem){saveQueue=saveQueue.then(()=>new Promise(resolve=>{try{tg.CloudStorage.setItem(CLOUD_KEY,payload,()=>resolve())}catch{resolve()}}))}}
function loadLocal(){try{return safeParse(localStorage.getItem(SAVE_KEY))}catch{return null}}
function loadCloud(){return new Promise(resolve=>{if(!tg?.CloudStorage?.getItem){resolve(null);return}try{tg.CloudStorage.getItem(CLOUD_KEY,(err,value)=>resolve(err?null:safeParse(value)))}catch{resolve(null)}})}
function has(flag){return !flag||state.flags.includes(flag)}
function addFlag(flag){if(flag&&!has(flag))state.flags.push(flag)}
function clearTimers(){pendingSMS.forEach(clearTimeout);pendingSMS=[];if(typingTimer)clearInterval(typingTimer);typingTimer=null;typing=false}
function menu(show=true){$('menuOverlay').classList.toggle('hidden',!show);$('closeMenuBtn').classList.toggle('hidden',!current);$('continueBtn').disabled=!current&&!loadLocal();$('endingsList').classList.add('hidden')}
function startNew(){clearTimers();state=defaults();current=null;phoneMessage=null;phoneOpen=false;$('phoneOverlay').classList.add('hidden');$('game').classList.remove('hidden');$('phoneFab').classList.remove('hidden');menu(false);go('start')}
function continueGame(){if(!current){const stored=loadLocal();if(stored)state=stored}if(!scenes.has(state.scene)){startNew();return}$('game').classList.remove('hidden');$('phoneFab').classList.remove('hidden');menu(false);go(state.scene,true)}
function renderImage(name,date){const img=$('sceneImage'),missing=$('missing');const file=name||'no-image.jpg';$('sceneDate').textContent=date||'';missing.textContent=file;missing.classList.remove('hidden');img.classList.add('hidden');img.classList.add('fade');img.onload=()=>{missing.classList.add('hidden');img.classList.remove('hidden');requestAnimationFrame(()=>requestAnimationFrame(()=>img.classList.remove('fade')))};img.onerror=()=>{img.classList.add('hidden');missing.classList.remove('hidden')};img.src='images/'+encodeURIComponent(file)}
function showText(text){if(typingTimer)clearInterval(typingTimer);fullText=String(text||'');charIndex=0;typing=true;$('storyText').textContent='';$('choices').replaceChildren();$('hint').textContent='Торкніться тексту, щоб показати все';typingTimer=setInterval(()=>{charIndex++;$('storyText').textContent=fullText.slice(0,charIndex);if(charIndex>=fullText.length)finishTyping()},28);if(!fullText)finishTyping()}
function finishTyping(){if(typingTimer)clearInterval(typingTimer);typingTimer=null;typing=false;charIndex=fullText.length;$('storyText').textContent=fullText;$('hint').textContent=current?.end?'Фінал відкрито':'Торкніться тексту, щоб продовжити';renderChoices()}
function renderChoices(){const box=$('choices');box.replaceChildren();if(!current)return;if(current.end){const b=makeButton('До меню',()=>menu());box.append(b);return}const available=(current.choices||[]).filter(c=>has(c.need));if(available.length){available.forEach(c=>box.append(makeButton(c.text,()=>{addFlag(c.set);save();go(c.next)})));return}if(current.next){box.append(makeButton('Далі',()=>go(current.next)))}else{box.append(makeButton('До меню',()=>menu()))}}
function makeButton(label,fn){const b=document.createElement('button');b.className='choice';b.textContent=label;b.addEventListener('click',fn);return b}
function advance(){if(!current||phoneOpen||!$('menuOverlay').classList.contains('hidden'))return;if(typing){finishTyping();return}const choices=(current.choices||[]).filter(c=>has(c.need));if(choices.length||current.end)return;if(current.next)go(current.next)}
function go(id,arrivals=true){clearTimers();let s=scenes.get(id),steps=0;while(s&&s.check&&steps++<30){const hit=s.check.find(x=>has(x.need));s=scenes.get(hit?hit.next:s.else)}if(!s){alert('Помилка: сцени «'+id+'» немає у story.js');return}current=s;state.scene=s.id;sceneToken++;renderImage(s.img,s.date);showText(s.text||'');if(s.end&&!state.unlocked.includes(s.id))state.unlocked.push(s.id);save();if(arrivals){const entries=s.sms?Array.isArray(s.sms)?s.sms:[s.sms]:[];const token=sceneToken;entries.forEach((entry,index)=>{const key=s.id+':'+index;if(state.delivered.includes(key))return;pendingSMS.push(setTimeout(()=>{if(token!==sceneToken||state.delivered.includes(key))return;state.delivered.push(key);state.messages.push({id:key,from:entry.from||'Невідомо',text:entry.text||'',replies:entry.replies||[],read:false,answered:false});save();updateBadge();notify()},Math.max(0,Number(entry.delay)||0)*1000))})}updateBadge();if(phoneOpen)renderPhone()}
function notify(){const fab=$('phoneFab');fab.classList.remove('shake');void fab.offsetWidth;fab.classList.add('shake');try{tg?.HapticFeedback?.notificationOccurred('success')}catch{}try{if(navigator.vibrate)navigator.vibrate(90)}catch{}beep()}
let audioContext=null;function beep(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;audioContext=audioContext||new C();if(audioContext.state==='suspended')audioContext.resume();const osc=audioContext.createOscillator(),gain=audioContext.createGain(),now=audioContext.currentTime;osc.type='square';osc.frequency.value=740;gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.045,now+.01);gain.gain.exponentialRampToValueAtTime(.0001,now+.13);osc.connect(gain).connect(audioContext.destination);osc.start(now);osc.stop(now+.14)}catch{}}
function updateBadge(){const count=state.messages.filter(m=>!m.read).length;$('unreadBadge').textContent=count;$('unreadBadge').classList.toggle('hidden',count===0)}
function openPhone(){phoneOpen=true;$('phoneOverlay').classList.remove('hidden');phoneMessage=null;renderPhone()}
function closePhone(){phoneOpen=false;$('phoneOverlay').classList.add('hidden');phoneMessage=null;save()}
function renderPhone(){const signal=!!current?.signal;$('signalDisplay').textContent=signal?'▁▂▃▄  Мережа':'▁  Немає мережі';$('balanceDisplay').textContent='Баланс: '+state.balance+' SMS';$('lcdStatus').textContent='';$('phoneBack').classList.toggle('hidden',!phoneMessage);const list=$('lcdList');list.replaceChildren();if(phoneMessage){const m=state.messages.find(x=>x.id===phoneMessage);if(!m){phoneMessage=null;renderPhone();return}$('lcdTitle').textContent=m.from;const body=document.createElement('div');body.className='smsBody';body.textContent=m.text;list.append(body);if(m.answered){const p=document.createElement('p');p.textContent='Відповідь надіслано';list.append(p)}else if(!m.replies.length){const p=document.createElement('p');p.textContent='Немає варіантів відповіді';list.append(p)}else{m.replies.forEach(reply=>{const b=document.createElement('button');b.className='reply';b.textContent='↳ '+reply.text;b.addEventListener('click',()=>sendReply(m.id,reply));list.append(b)})}if(!signal)$('lcdStatus').textContent='Немає мережі';else if(state.balance===0)$('lcdStatus').textContent='Недостатньо коштів на рахунку';return}
$('lcdTitle').textContent='Вхідні';if(!state.messages.length){const p=document.createElement('p');p.textContent='Повідомлень поки немає';list.append(p)}state.messages.slice().reverse().forEach(m=>{const b=document.createElement('button');b.className='smsItem'+(m.read?'':' unread');const sender=document.createElement('strong');sender.textContent=(m.read?'':'● ')+m.from;const preview=document.createElement('small');preview.textContent=m.text;b.append(sender,preview);b.addEventListener('click',()=>{m.read=true;phoneMessage=m.id;save();updateBadge();renderPhone()});list.append(b)})}
function sendReply(id,reply){const m=state.messages.find(x=>x.id===id);if(!m||m.answered)return;if(!current?.signal){$('lcdStatus').textContent='Немає мережі';return}if(state.balance<=0){$('lcdStatus').textContent='Недостатньо коштів на рахунку';return}state.balance--;m.answered=true;m.reply=reply.text;addFlag(reply.set);save();renderPhone();if(!typing)renderChoices()}
function renderEndings(){const list=$('endingsList');list.replaceChildren();ENDINGS.forEach(id=>{const s=scenes.get(id),item=document.createElement('div');item.className='endingRow';item.textContent=state.unlocked.includes(id)?(s?.end||id):'???';list.append(item)});list.classList.remove('hidden')}
$('storyText').addEventListener('click',advance);$('storyText').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();advance()}});$('menuBtn').addEventListener('click',()=>menu());$('closeMenuBtn').addEventListener('click',()=>menu(false));$('newBtn').addEventListener('click',()=>{if(current&&!confirm('Почати нову гру? Поточний прогрес буде втрачено.'))return;startNew()});$('continueBtn').addEventListener('click',continueGame);$('endingsBtn').addEventListener('click',renderEndings);$('phoneFab').addEventListener('click',openPhone);$('closePhoneBtn').addEventListener('click',closePhone);$('phoneBack').addEventListener('click',()=>{phoneMessage=null;renderPhone()});
// CloudStorage is asynchronous. Read it before allowing a resumed session.
(async()=>{const local=loadLocal(),cloud=await loadCloud();cloudLoaded=true;state=(cloud&&(!local||cloud.revision>local.revision)?cloud:local)||defaults();if(!scenes.has(state.scene))state=defaults();$('continueBtn').disabled=!(local||cloud);menu(true)})();
})();
</script>
</body>
</html>
